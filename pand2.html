
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Living Painting 🎨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap');

:root {
  --gold: #d9b879;
  --cream: #f8f0df;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  background: #111713;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 35%, #33483a66, transparent 55%),
    linear-gradient(120deg, #101713, #1c2119 50%, #101411);
}

.app {
  position: relative;
  min-height: 100vh;
  padding: 35px 18px 28px;
  display: flex;
  align-items: center;
  flex-direction: column;
}

.topline {
  width: min(950px, 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #c6bca4;
  font-size: 10px;
  letter-spacing: 3px;
}

.logo { color: var(--gold); font-weight: 700; }

.intro {
  text-align: center;
  margin: 35px 0 25px;
}

.eyebrow {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(42px, 7vw, 76px);
  line-height: 1.08;
  margin: 12px 0;
  letter-spacing: -1px;
}

.intro p {
  font-size: 12px;
  color: #b3b8aa;
  line-height: 1.8;
}

/* Ornate painting frame */
.gallery {
  position: relative;
  width: min(470px, 88vw);
  aspect-ratio: 4 / 4.3;
  padding: 12px;
  border: 2px solid #b78c4e;
  outline: 1px solid #6f5434;
  outline-offset: 5px;
  background: linear-gradient(135deg, #6e4d29, #e2c181 18%, #684522 38%, #cda96b 55%, #553b20 80%, #d2ad6b);
  box-shadow:
    0 0 0 9px #1b1c15,
    0 0 0 11px #80633d,
    0 25px 70px #0009;
  transition: transform 1s, box-shadow 1s;
}

.gallery::before, .gallery::after {
  content: "✦";
  position: absolute;
  z-index: 9;
  color: #f8dca1;
  font-size: 23px;
  text-shadow: 0 0 10px #ffe3a1;
}

.gallery::before { top: -13px; left: -9px; }
.gallery::after { bottom: -13px; right: -9px; }

.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #192b29;
  isolation: isolate;
}

/* Sky and moon */
.sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(#142a35, #41594e 55%, #a7a36e);
  transition: background 2s;
}

.moon {
  position: absolute;
  top: 12%;
  right: 17%;
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #f5e8ba;
  box-shadow: 0 0 25px #ffe7a4, 0 0 65px #ffe6a455;
  transition: all 2s;
}

/* Mountains */
.mountains {
  position: absolute;
  left: -10%;
  bottom: 31%;
  width: 120%;
  height: 42%;
  background: #263f3c;
  clip-path: polygon(0 75%, 16% 23%, 29% 62%, 45% 8%, 62% 67%, 78% 25%, 100% 75%, 100% 100%, 0 100%);
  transition: transform 2s;
}

.mountains.back {
  background: #40564a;
  bottom: 26%;
  transform: scaleX(-1) scale(1.1);
  opacity: .7;
}

.ground {
  position: absolute;
  left: -10%;
  bottom: -12%;
  width: 120%;
  height: 47%;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(145deg, #557750, #203f31 75%);
  transition: all 2s;
}

.path {
  position: absolute;
  bottom: -12%;
  left: 40%;
  width: 35%;
  height: 50%;
  background: #a99a70;
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  opacity: .75;
  transition: all 2s;
}

/* Trees */
.tree {
  position: absolute;
  bottom: 24%;
  width: 10px;
  height: 100px;
  background: #352d26;
  transform-origin: bottom;
  transition: height 1.7s;
}

.tree::before, .tree::after {
  content: "";
  position: absolute;
  width: 70px;
  height: 85px;
  left: -30px;
  top: -35px;
  background: #244d3d;
  clip-path: polygon(50% 0, 100% 65%, 72% 60%, 100% 100%, 0 100%, 28% 60%, 0 65%);
}

.tree::after {
  top: 8px;
  left: -24px;
  transform: scale(.75);
  background: #38704c;
}

.tree.one { left: 13%; height: 100px; }
.tree.two { right: 12%; height: 135px; transform: scale(1.15); }
.tree.three { left: 28%; height: 70px; transform: scale(.75); }

/* Flowers */
.flower {
  position: absolute;
  bottom: 13%;
  font-size: 20px;
  opacity: 0;
  transform: translateY(25px) scale(.2);
  transition: opacity .8s, transform .9s cubic-bezier(.2,1.4,.4,1);
  filter: drop-shadow(0 0 5px #ffb7d3);
}

.f1 { left: 12%; }
.f2 { left: 25%; bottom: 20%; }
.f3 { right: 19%; }
.f4 { right: 8%; bottom: 23%; }
.f5 { left: 44%; bottom: 12%; }
.f6 { right: 36%; bottom: 19%; }

/* Butterflies */
.butterfly {
  position: absolute;
  left: 20%;
  top: 45%;
  z-index: 4;
  font-size: 22px;
  opacity: 0;
  filter: drop-shadow(0 0 8px #ffe6ac);
}

.butterfly.b2 { left: 70%; top: 56%; font-size: 17px; }
.butterfly.b3 { left: 45%; top: 32%; font-size: 14px; }

.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #ffe7a6;
  border-radius: 50%;
  box-shadow: 0 0 10px 2px #f9dca0;
  animation: sparkle 2.5s ease-in-out infinite alternate;
}

@keyframes sparkle {
  from { opacity: .1; transform: scale(.5); }
  to { opacity: 1; transform: scale(1.7); }
}

/* Dormant painting effect */
.canvas::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  background: linear-gradient(125deg, #fff1c01a, transparent 40%, #0003);
  transition: opacity 1s;
}

.gallery.awake .canvas::after { opacity: .15; }

/* Awake world */
.gallery.awake .sky {
  background: linear-gradient(#283c79, #8d83b9 50%, #f1b8a3);
}

.gallery.awake .moon {
  background: #fff4ce;
  box-shadow: 0 0 35px 12px #ffe5ad88, 0 0 100px #ffe4ab88;
  transform: scale(1.2);
}

.gallery.awake .mountains {
  background: #574a72;
  transform: translateY(-10px);
}

.gallery.awake .mountains.back {
  background: #88739c;
  transform: scaleX(-1) scale(1.1) translateY(-8px);
}

.gallery.awake .ground {
  background: linear-gradient(145deg, #8bc48a, #315e53);
}

.gallery.awake .path {
  background: #f0d9aa;
  opacity: .9;
}

.gallery.awake .tree::before { background: #315e48; }
.gallery.awake .tree::after { background: #71a76a; }

.gallery.awake .flower {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.gallery.awake .butterfly {
  opacity: 1;
  animation: fly 5s ease-in-out infinite;
}

.gallery.awake .butterfly.b2 { animation-delay: -2s; }
.gallery.awake .butterfly.b3 { animation-delay: -3.5s; }

@keyframes fly {
  0%,100% { transform: translate(0,0) rotate(-12deg); }
  25% { transform: translate(20px,-24px) rotate(12deg); }
  50% { transform: translate(42px,5px) rotate(-8deg); }
  75% { transform: translate(14px,28px) rotate(15deg); }
}

/* Buttons and caption */
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 35px;
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.awaken {
  padding: 15px 25px;
  background: linear-gradient(135deg, #e9c98c, #bd9455);
  color: #1d241b;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  box-shadow: 0 8px 25px #d5b26c22;
  transition: transform .25s, filter .25s;
}

.awaken:hover { transform: translateY(-3px); filter: brightness(1.1); }

.reset {
  padding: 15px 20px;
  background: #ffffff0b;
  border: 1px solid #ffffff26;
  color: #d9d5c8;
  font-size: 11px;
  letter-spacing: 1px;
}

.caption {
  margin-top: 22px;
  min-height: 25px;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: #d7c6a1;
  font-style: italic;
}

.bottom {
  margin-top: 25px;
  color: #777f70;
  font-size: 9px;
  letter-spacing: 3px;
  text-align: center;
}

@media(max-width:600px) {
  .app { padding: 24px 15px; }
  .topline { font-size: 8px; letter-spacing: 1.5px; }
  .intro { margin: 30px 0 23px; }
  .gallery { width: min(390px, 84vw); }
  .controls { margin-top: 30px; }
  .awaken { padding: 14px 18px; }
  .caption { font-size: 19px; }
}
</style>
</head>

<body>
<main class="app">

  <div class="topline">
    <span class="logo">✦ THE ART ROOM</span>
    <span>EXPERIMENT NO. 001</span>
  </div>

  <section class="intro">
    <div class="eyebrow">A WORLD BEYOND THE FRAME</div>
    <h1>The Living Painting</h1>
    <p>Some paintings are not meant to be watched.<br>
    They are meant to be awakened.</p>
  </section>

  <div class="gallery" id="gallery">
    <div class="canvas">

      <div class="sky"></div>
      <div class="moon"></div>

      <div class="mountains back"></div>
      <div class="mountains"></div>

      <div class="ground"></div>
      <div class="path"></div>

      <div class="tree one"></div>
      <div class="tree two"></div>
      <div class="tree three"></div>

      <div class="flower f1">🌷</div>
      <div class="flower f2">🌼</div>
      <div class="flower f3">🌸</div>
      <div class="flower f4">🌷</div>
      <div class="flower f5">🌻</div>
      <div class="flower f6">🌺</div>

      <div class="butterfly">🦋</div>
      <div class="butterfly b2">🦋</div>
      <div class="butterfly b3">✨</div>

      <div class="particles" id="particles"></div>
    </div>
  </div>

  <div class="controls">
    <button class="awaken" id="awaken">
      ✦ AWAKEN THE PAINTING
    </button>
    <button class="reset" id="reset">↺ RESET WORLD</button>
  </div>

  <div class="caption" id="caption">
    A little magic is waiting...
  </div>

  <div class="bottom">
    CREATED WITH HTML · CSS · JAVASCRIPT
  </div>

</main>

<script>
const gallery = document.getElementById('gallery');
const awaken = document.getElementById('awaken');
const reset = document.getElementById('reset');
const caption = document.getElementById('caption');
const particles = document.getElementById('particles');

let awake = false;

// Generate glowing stars inside the painting
for (let i = 0; i < 35; i++) {
  const star = document.createElement('span');
  star.className = 'particle';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 3 + 's';
  star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
  particles.appendChild(star);
}

awaken.addEventListener('click', () => {
  if (awake) return;
  awake = true;

  gallery.classList.add('awake');
  caption.textContent = 'And suddenly... the world began to bloom. ✨';
  awaken.textContent = '✦ THE WORLD IS ALIVE';
});

reset.addEventListener('click', () => {
  awake = false;
  gallery.classList.remove('awake');
  caption.textContent = 'A little magic is waiting...';
  awaken.textContent = '✦ AWAKEN THE PAINTING';
});
</script>
</body>
</html>
