
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Neon Energy Core</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: #050510;
  color: white;
  font-family: Arial, sans-serif;
}

.scene {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1000px;
  background:
    radial-gradient(ellipse at center,
      #15144b 0%, #080817 42%, #030309 100%);
}

.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 15% 20%, white 90%, transparent),
    radial-gradient(2px 2px at 80% 15%, #9dfcff 90%, transparent),
    radial-gradient(1px 1px at 70% 70%, white 90%, transparent),
    radial-gradient(2px 2px at 25% 75%, #a66bff 90%, transparent),
    radial-gradient(1px 1px at 45% 30%, white 90%, transparent),
    radial-gradient(2px 2px at 90% 55%, #8b9dff 90%, transparent);
  background-size: 240px 240px;
  animation: stars 15s linear infinite;
}

@keyframes stars {
  to { transform: translateY(-240px); }
}

.heading {
  position: absolute;
  top: 8%;
  text-align: center;
  z-index: 5;
}

.heading h1 {
  font-size: clamp(24px, 5vw, 48px);
  letter-spacing: 5px;
  text-shadow: 0 0 25px #8d59ff;
}

.heading p {
  color: #aaa8d8;
  font-size: 12px;
  letter-spacing: 4px;
  margin-top: 12px;
}

.core {
  position: relative;
  width: 180px;
  height: 180px;
  transform-style: preserve-3d;
  animation: float 4s ease-in-out infinite;
  transition: transform .15s ease-out;
  z-index: 2;
}

.orb {
  position: absolute;
  inset: 15px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 25%,
      #fff 0%, #a7ffff 5%, #36aaff 20%,
      #6c39ff 48%, #170c53 75%, #03030c 100%);
  box-shadow:
    0 0 25px #4b7dff,
    0 0 60px #623dff,
    0 0 110px #4c1aff,
    inset -15px -10px 30px #000;
  animation: pulse 2s ease-in-out infinite alternate;
}

.orb::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 2px solid rgba(109, 233, 255, .6);
  filter: blur(2px);
}

.orb::after {
  content: "";
  position: absolute;
  width: 38px;
  height: 38px;
  top: 25px;
  left: 35px;
  background: white;
  border-radius: 50%;
  filter: blur(16px);
  opacity: .8;
}

.ring {
  position: absolute;
  inset: -45px;
  border: 2px solid transparent;
  border-top-color: #65faff;
  border-bottom-color: #a45cff;
  border-radius: 50%;
  box-shadow: 0 0 15px #693bff;
}

.ring.one {
  transform: rotateX(68deg) rotateY(-20deg);
  animation: rotateOne 5s linear infinite;
}

.ring.two {
  inset: -30px;
  border-left-color: #a95cff;
  border-right-color: #54eaff;
  transform: rotateY(70deg) rotateX(25deg);
  animation: rotateTwo 4s linear infinite;
}

.ring.three {
  inset: -55px;
  border-top-color: #b56cff;
  border-bottom-color: #3e7dff;
  transform: rotateX(75deg) rotateZ(40deg);
  animation: rotateThree 7s linear infinite;
}

@keyframes rotateOne {
  from { transform: rotateX(68deg) rotateY(-20deg) rotateZ(0); }
  to { transform: rotateX(68deg) rotateY(-20deg) rotateZ(360deg); }
}

@keyframes rotateTwo {
  from { transform: rotateY(70deg) rotateX(25deg) rotateZ(0); }
  to { transform: rotateY(70deg) rotateX(25deg) rotateZ(-360deg); }
}

@keyframes rotateThree {
  from { transform: rotateX(75deg) rotateZ(0); }
  to { transform: rotateX(75deg) rotateZ(360deg); }
}

@keyframes pulse {
  from { filter: hue-rotate(0deg) brightness(1); }
  to { filter: hue-rotate(25deg) brightness(1.3); }
}

@keyframes float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -18px; }
}

.particle {
  position: absolute;
  width: 5px;
  height: 5px;
  background: #8dfaff;
  border-radius: 50%;
  box-shadow: 0 0 12px 3px #526dff;
  animation: particle 5s ease-in-out infinite alternate;
}

@keyframes particle {
  from { transform: translate3d(0, 30px, 0) scale(.5); opacity: .2; }
  to { transform: translate3d(20px, -60px, 30px) scale(1.5); opacity: 1; }
}

.floor {
  position: absolute;
  bottom: -25%;
  width: 100%;
  height: 45%;
  background: repeating-linear-gradient(
    90deg, transparent 0 79px, #30236b33 80px 81px
  );
  transform: perspective(350px) rotateX(65deg);
  transform-origin: top;
  mask-image: linear-gradient(to bottom, black, transparent);
}

.controls {
  position: absolute;
  bottom: 9%;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

button {
  border: 1px solid #a48bff;
  padding: 13px 28px;
  border-radius: 30px;
  color: white;
  background: linear-gradient(110deg, #5c35d9, #157cc5);
  box-shadow: 0 0 25px #5e39ff55;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 35px #8e5dff;
}

#status {
  color: #aaa9d4;
  font-size: 12px;
  letter-spacing: 2px;
}

@media(max-width: 500px) {
  .core { transform: scale(.8); }
  .heading p { letter-spacing: 2px; }
}
</style>
</head>

<body>
<div class="scene" id="scene">
  <div class="stars"></div>
  <div class="floor"></div>

  <header class="heading">
    <h1>ENERGY CORE</h1>
    <p>THE FUTURE IS IN YOUR CODE</p>
  </header>

  <div class="core" id="core">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="orb"></div>
  </div>

  <div class="controls">
    <button id="power">⚡ BOOST ENERGY</button>
    <div id="status">SYSTEM ACTIVE · 100%</div>
  </div>
</div>

<script>
const scene = document.getElementById("scene");
const core = document.getElementById("core");
const button = document.getElementById("power");
const statusText = document.getElementById("status");

let boosted = false;

// Create floating particles
for (let i = 0; i < 55; i++) {
  const particle = document.createElement("div");
  particle.className = "particle";

  particle.style.left = Math.random() * 100 + "%";
  particle.style.top = Math.random() * 100 + "%";
  particle.style.animationDelay = Math.random() * 5 + "s";
  particle.style.animationDuration = 2 + Math.random() * 5 + "s";

  if (i % 2 === 0) {
    particle.style.background = "#bd7bff";
  }

  scene.appendChild(particle);
}

scene.addEventListener("pointermove", (event) => {
  const x = (event.clientX / window.innerWidth - 0.5) * 2;
  const y = (event.clientY / window.innerHeight - 0.5) * 2;

  core.style.transform =
    `rotateY(${x * 25}deg) rotateX(${-y * 25}deg) scale(${boosted ? 1.15 : 1})`;
});


button.addEventListener("click", () => {
  boosted = !boosted;

  document.querySelectorAll(".ring").forEach((ring) => {
    ring.style.animationDuration = boosted ? "1.2s" : "";
  });

  document.querySelector(".orb").style.boxShadow = boosted
    ? "0 0 45px #65faff, 0 0 100px #623dff, 0 0 170px #a22cff"
    : "";

  button.textContent = boosted ? "✦ NORMAL MODE" : "⚡ BOOST ENERGY";
  statusText.textContent = boosted
    ? "OVERDRIVE MODE · 200%"
    : "SYSTEM ACTIVE · 100%";
});
</script>
</body>
</html>
