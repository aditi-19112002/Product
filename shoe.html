<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ColorMorph Chair - Single Chair</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      background: #e9ecef;
      overflow: hidden;
    }

    .card {
      width: 380px;
      background: #1e293b;
      border-radius: 28px;
      padding: 28px 28px 32px;
      position: relative;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.5);
      transition: all 0.4s ease;
    }

    /* Cart Icon */
    .cart-icon {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 20;
    }

    .cart-icon:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.08);
    }

    .cart-icon svg {
      width: 24px;
      height: 24px;
      stroke: white;
    }

    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cart-count.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Chair Stage */
    .chair-stage {
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      margin-bottom: 24px;
      position: relative;
    }

    .chair-wrapper {
      width: 240px;
      height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* Single Chair Image */
    .chair-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.4));
      transition: filter 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .glow {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      height: 45px;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.5;
      transition: background 0.5s ease;
      z-index: -1;
    }

    .color-name {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-bottom: 18px;
      height: 22px;
      color: rgba(255,255,255,0.9);
    }

    .swatches {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .swatch:hover { transform: scale(1.15); }
    .swatch.active {
      border-color: white;
      transform: scale(1.22);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.2);
    }

    .swatch.red   { background: #ef4444; }
    .swatch.blue  { background: #3b82f6; }
    .swatch.green { background: #10b981; }
    .swatch.black { background: #1e293b; border: 2px solid #64748b; }

    .info {
      text-align: center;
      margin-bottom: 22px;
    }

    .info h2 {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
    }

    .info p {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .price {
      font-size: 26px;
      font-weight: 700;
      color: white;
    }

    .old-price {
      font-size: 16px;
      color: rgba(255,255,255,0.45);
      text-decoration: line-through;
    }

    .badge {
      background: linear-gradient(135deg, #f87171, #ef4444);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: white;
      color: #0f172a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
    }

    .btn:active { transform: scale(0.97); }

    .btn.added {
      background: #10b981;
      color: white;
    }

    .btn .check {
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn.added .check {
      opacity: 1;
      transform: scale(1);
    }

    .btn.added .cart-text {
      opacity: 0;
      position: absolute;
    }

    .flying-chair {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 80px;
      height: 80px;
      object-fit: contain;
      transition: all 0.85s cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <!-- Cart Icon -->
    <div class="cart-icon" id="cartIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span class="cart-count" id="cartCount">0</span>
    </div>

    <div class="chair-stage">
      <div class="glow" id="glow"></div>
      <div class="chair-wrapper" id="chairWrapper">
        <!-- Sirf EK chair image -->
        <img src="https://images.unsplash.com/photo-1592078615290-033ee584e267?w=600&q=80" 
             class="chair-img" id="chair" alt="Chair">
      </div>
    </div>

    <div class="color-name" id="colorName">Royal Blue</div>

    <div class="swatches">
      <div class="swatch red"   data-color="red"   data-name="Crimson Red"></div>
      <div class="swatch blue active"  data-color="blue"  data-name="Royal Blue"></div>
      <div class="swatch green" data-color="green" data-name="Emerald Green"></div>
      <div class="swatch black" data-color="black" data-name="Midnight Black"></div>
    </div>

    <div class="info">
      <h2>Aero Lounge Chair</h2>
      <p>Handcrafted premium leather • Ergonomic design</p>
    </div>

    <div class="price-row">
      <span class="price">$349</span>
      <span class="old-price">$499</span>
      <span class="badge">30% OFF</span>
    </div>

    <button class="btn" id="addBtn">
      <span class="cart-text">Add to Cart</span>
      <svg class="check" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </button>
  </div>

  <script>
    const swatches = document.querySelectorAll('.swatch');
    const chair = document.getElementById('chair');
    const colorName = document.getElementById('colorName');
    const glow = document.getElementById('glow');
    const chairWrapper = document.getElementById('chairWrapper');
    const addBtn = document.getElementById('addBtn');
    const cartIcon = document.getElementById('cartIcon');
    const cartCount = document.getElementById('cartCount');

    let cartItems = 0;

    // Color filters for the single chair
    const colorFilters = {
      red:   'hue-rotate(320deg) saturate(1.6) brightness(0.95)',
      blue:  'hue-rotate(180deg) saturate(1.3) brightness(1)',
      green: 'hue-rotate(90deg) saturate(1.5) brightness(0.95)',
      black: 'grayscale(1) brightness(0.35) contrast(1.2)'
    };

    const glowColors = {
      red:   'rgba(239, 68, 68, 0.6)',
      blue:  'rgba(59, 130, 246, 0.6)',
      green: 'rgba(16, 185, 129, 0.6)',
      black: 'rgba(100, 116, 139, 0.5)'
    };

    // Color switch - only chair color changes
    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        const color = swatch.dataset.color;
        const name = swatch.dataset.name;

        // Active swatch
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');

        // Change only chair color
        chair.style.filter = colorFilters[color] + ' drop-shadow(0 20px 30px rgba(0,0,0,0.4))';

        // Update name + glow
        colorName.textContent = name;
        glow.style.background = glowColors[color];
      });
    });

    // 3D tilt
    chairWrapper.addEventListener('mousemove', (e) => {
      const rect = chairWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = ((y - centerY) / centerY) * -12;
      const rotateY = ((x - centerX) / centerX) * 12;

      chairWrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    chairWrapper.addEventListener('mouseleave', () => {
      chairWrapper.style.transform = 'rotateX(0) rotateY(0)';
    });

    // Fly to cart
    function flyToCart() {
      const chairRect = chair.getBoundingClientRect();
      const cartRect = cartIcon.getBoundingClientRect();

      const flying = document.createElement('img');
      flying.src = chair.src;
      flying.className = 'flying-chair';
      flying.style.left = chairRect.left + 'px';
      flying.style.top = chairRect.top + 'px';
      flying.style.width = chairRect.width + 'px';
      flying.style.height = chairRect.height + 'px';
      flying.style.filter = chair.style.filter;
      document.body.appendChild(flying);

      flying.offsetWidth;

      flying.style.left = (cartRect.left + cartRect.width / 2 - 25) + 'px';
      flying.style.top = (cartRect.top + cartRect.height / 2 - 25) + 'px';
      flying.style.width = '50px';
      flying.style.height = '50px';
      flying.style.opacity = '0.3';
      flying.style.transform = 'scale(0.3) rotate(20deg)';

      setTimeout(() => {
        flying.remove();
        cartItems++;
        cartCount.textContent = cartItems;
        cartCount.classList.add('show');

        cartIcon.style.transform = 'scale(1.2)';
        setTimeout(() => cartIcon.style.transform = 'scale(1)', 200);
      }, 850);
    }

    // Add to Cart
    addBtn.addEventListener('click', () => {
      if (addBtn.classList.contains('added')) return;

      flyToCart();

      addBtn.classList.add('added');
      addBtn.querySelector('.cart-text').textContent = 'Added!';

      setTimeout(() => {
        addBtn.classList.remove('added');
        addBtn.querySelector('.cart-text').textContent = 'Add to Cart';
      }, 1800);
    });

    // Initial color (Blue)
    chair.style.filter = colorFilters.blue + ' drop-shadow(0 20px 30px rgba(0,0,0,0.4))';
    glow.style.background = glowColors.blue;
  </script>
</body>
</html>
