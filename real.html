<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Pixel Creates Everything</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020208;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

.ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pixel{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
    box-shadow:
        0 0 10px white,
        0 0 30px #7c3aed,
        0 0 70px #2563eb;
}

.text{
    position:absolute;
    text-align:center;
    opacity:0;
    transform:scale(.5);
    transition:2s ease;
}

.text h1{
    font-size:clamp(40px,8vw,100px);
    color:white;
    letter-spacing:8px;
    text-shadow:
        0 0 10px white,
        0 0 30px #8b5cf6,
        0 0 70px #6366f1;
}

.text p{
    margin-top:15px;
    color:#aaa;
    letter-spacing:6px;
    font-size:15px;
}

.intro{
    position:absolute;
    bottom:12%;
    color:#777;
    font-size:13px;
    letter-spacing:4px;
    opacity:0;
    transition:1s;
}

.flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">

    <div class="pixel" id="pixel"></div>

    <div class="intro" id="intro">
        ONE PIXEL
    </div>

    <div class="text" id="finalText">
        <h1>CREATE</h1>
        <p>CODE CREATES WORLDS</p>
    </div>

</div>

<div class="flash" id="flash"></div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* =================================
   PARTICLE CLASS
================================= */

class Particle{

    constructor(x,y,targetX,targetY){

        this.x=x;
        this.y=y;

        this.targetX=targetX;
        this.targetY=targetY;

        this.size=Math.random()*2+0.5;

        this.speed=Math.random()*0.025+0.01;

        this.angle=Math.random()*Math.PI*2;

        this.life=1;

        this.hue=
            Math.random()>0.5
            ? 260+Math.random()*50
            : 190+Math.random()*40;

    }


    form(){

        this.x +=
            (this.targetX-this.x)
            *this.speed;

        this.y +=
            (this.targetY-this.y)
            *this.speed;

    }


    explode(){

        let dx=this.x-W/2;
        let dy=this.y-H/2;

        let distance=Math.sqrt(dx*dx+dy*dy);

        let force=0.8+Math.random()*1.5;

        this.x +=
            (dx/distance)*force*10;

        this.y +=
            (dy/distance)*force*10;

        this.life-=0.01;

    }


    draw(){

        ctx.save();

        ctx.globalAlpha=this.life;

        ctx.fillStyle=
            `hsl(${this.hue},100%,70%)`;

        ctx.shadowBlur=15;

        ctx.shadowColor=
            `hsl(${this.hue},100%,70%)`;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }

}


/* =================================
   CREATE PLANET TARGET
================================= */

let particles=[];

function createPlanet(){

    particles=[];

    const radius=
        Math.min(W,H)*0.22;

    for(let i=0;i<1800;i++){

        let angle=
            Math.random()*Math.PI*2;

        let r=
            Math.sqrt(Math.random())*radius;

        let x=
            W/2+
            Math.cos(angle)*r;

        let y=
            H/2+
            Math.sin(angle)*r;

        /*
        Make the planet slightly irregular
        */

        let noise=
            Math.sin(angle*7)*10;

        x+=noise;
        y+=noise;

        particles.push(
            new Particle(
                W/2,
                H/2,
                x,
                y
            )
        );

    }

}


/* =================================
   STAR FIELD
================================= */

let stars=[];

for(let i=0;i<350;i++){

    stars.push({

        x:Math.random()*W,
        y:Math.random()*H,

        size:Math.random()*1.5,

        speed:
            Math.random()*0.4+0.1

    });

}


/* =================================
   DRAW STARS
================================= */

function drawStars(){

    stars.forEach(star=>{

        star.y+=star.speed;

        if(star.y>H){

            star.y=0;

            star.x=Math.random()*W;

        }

        ctx.fillStyle=
            "rgba(255,255,255,.7)";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

}


/* =================================
   MAIN ANIMATION
================================= */

let start=performance.now();

let phase="intro";

function animate(){

    requestAnimationFrame(animate);

    ctx.fillStyle=
        "rgba(2,2,8,.22)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawStars();


    /* ==========================
       PARTICLES
    ========================== */

    particles.forEach(p=>{

        if(phase==="forming"){

            p.form();

        }

        if(phase==="exploding"){

            p.explode();

        }

        p.draw();

    });


    let time=
        (performance.now()-start)/1000;


    /* ==========================
       PHASE 1
    ========================== */

    if(time>0.5 && time<2){

        document
        .getElementById("intro")
        .style.opacity="1";

    }


    /* ==========================
       PHASE 2
    ========================== */

    if(time>2 && phase==="intro"){

        phase="forming";

        createPlanet();

        document
        .getElementById("intro")
        .style.opacity="0";

    }


    /* ==========================
       PHASE 3
    ========================== */

    if(time>7 && phase==="forming"){

        phase="exploding";

    }


    /* ==========================
       PHASE 4
    ========================== */

    if(time>7.8){

        document
        .getElementById("finalText")
        .style.opacity="1";

        document
        .getElementById("finalText")
        .style.transform=
            "scale(1)";

    }


    if(time>7 && time<7.15){

        document
        .getElementById("flash")
        .style.opacity="0.8";

    }
    else{

        document
        .getElementById("flash")
        .style.opacity="0";

    }

}

animate();

</script>

</body>
</html>
