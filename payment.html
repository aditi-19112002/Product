<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payment Viral Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Background glow */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      z-index: 0;
    }
    .glow1 { background: #0072ff; top: 10%; left: -50px; }
    .glow2 { background: #ff416c; bottom: 15%; right: -60px; }

    .hook {
      font-size: 1.85rem;
      font-weight: 800;
      text-align: center;
      padding: 0 20px;
      margin-bottom: 28px;
      line-height: 1.3;
      background: linear-gradient(90deg, #ffffff, #a5b4fc, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite, fadeIn 0.8s ease forwards;
      opacity: 0;
      z-index: 2;
    }

    .card {
      width: 340px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 42px 28px 36px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      position: relative;
      z-index: 2;
      transform: scale(0.92);
      opacity: 0;
      animation: cardIn 0.7s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .icon-box {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .status {
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .sub {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 28px;
    }

    .progress {
      width: 100%;
      height: 7px;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 26px;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border-radius: 20px;
      transition: width 0.25s linear;
    }

    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 60px;
      font-size: 1.15rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 12px 30px rgba(0, 114, 255, 0.5);
      cursor: pointer;
      transition: 0.25s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.retry {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      box-shadow: 0 12px 30px rgba(255, 65, 108, 0.5);
    }
    .btn.success {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      box-shadow: 0 12px 30px rgba(0, 176, 155, 0.5);
      pointer-events: none;
    }

    /* Icons */
    .spinner {
      width: 64px;
      height: 64px;
      border: 5px solid rgba(255,255,255,0.15);
      border-top-color: #00c6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .fail {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      box-shadow: 0 0 40px rgba(255, 65, 108, 0.7);
      animation: shake 0.6s ease;
    }
    .success {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00b09b, #96c93d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      box-shadow: 0 0 50px rgba(0, 176, 155, 0.8);
      animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Animations */
    @keyframes shine {
      to { background-position: 200% center; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes cardIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-12px); }
      40%,80% { transform: translateX(12px); }
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    @keyframes flashRed {
      0%,100% { background: #050508; }
      50% { background: #2a0a12; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <div class="hook" id="hook">What if your payment fails? 😳</div>

  <div class="card">
    <div class="icon-box">
      <div id="icon">💳</div>
    </div>
    <div class="status" id="status">Ready to Pay</div>
    <div class="sub" id="sub">Tap below to continue</div>
    
    <div class="progress" id="progress">
      <div class="progress-bar" id="bar"></div>
    </div>

    <button class="btn" id="btn" onclick="start()">Pay Now</button>
  </div>

  <script>
    const icon = document.getElementById('icon');
    const status = document.getElementById('status');
    const sub = document.getElementById('sub');
    const btn = document.getElementById('btn');
    const progress = document.getElementById('progress');
    const bar = document.getElementById('bar');
    const hook = document.getElementById('hook');

    // Auto start after 1.8 seconds (best for recording)
    setTimeout(() => {
      if (!btn.classList.contains('hidden')) start();
    }, 1800);

    function start() {
      // Processing
      icon.innerHTML = '<div class="spinner"></div>';
      status.textContent = 'Processing...';
      sub.textContent = 'Please wait...';
      btn.classList.add('hidden');
      progress.style.display = 'block';

      let p = 0;
      const t = setInterval(() => {
        p += Math.random() * 14 + 6;
        if (p > 100) p = 100;
        bar.style.width = p + '%';
        if (p === 100) clearInterval(t);
      }, 160);

      setTimeout(() => {
        // FAIL
        progress.style.display = 'none';
        bar.style.width = '0%';
        icon.innerHTML = '<div class="fail">❌</div>';
        status.textContent = 'Payment Failed';
        sub.textContent = 'Something went wrong';
        btn.textContent = 'Retry Payment';
        btn.classList.remove('hidden');
        btn.classList.add('retry');
        btn.onclick = retry;

        // Red flash effect
        document.body.style.animation = 'flashRed 0.4s ease';
        setTimeout(() => document.body.style.animation = '', 400);
      }, 2300);
    }

    function retry() {
      icon.innerHTML = '<div class="spinner"></div>';
      status.textContent = 'Processing...';
      sub.textContent = 'Retrying payment...';
      btn.classList.add('hidden');
      progress.style.display = 'block';

      let p = 0;
      const t = setInterval(() => {
        p += Math.random() * 16 + 8;
        if (p > 100) p = 100;
        bar.style.width = p + '%';
        if (p === 100) clearInterval(t);
      }, 140);

      setTimeout(() => {
        // SUCCESS
        progress.style.display = 'none';
        icon.innerHTML = '<div class="success">✨</div>';
        status.textContent = 'Payment Successful';
        sub.textContent = 'Order Confirmed 🎉';
        btn.textContent = 'Done ✓';
        btn.classList.remove('hidden', 'retry');
        btn.classList.add('success');
        btn.onclick = null;

        // Big confetti
        confetti();
      }, 2000);
    }

    function confetti() {
      const colors = ['#00c6ff','#0072ff','#00b09b','#96c93d','#ff416c','#ffcc00','#a855f7','#ffffff'];
      for (let i = 0; i < 80; i++) {
        const c = document.createElement('div');
        c.style.cssText = `
          position:fixed; width:${6+Math.random()*9}px; height:${6+Math.random()*9}px;
          background:${colors[Math.floor(Math.random()*colors.length)]};
          top:45%; left:50%; border-radius:${Math.random()>0.5?'50%':'2px'};
          pointer-events:none; z-index:99;
        `;
        document.body.appendChild(c);

        const angle = Math.random() * Math.PI * 2;
        const dist = 90 + Math.random() * 140;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist - 40;

        c.animate([
          { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${x}px,${y}px) rotate(${Math.random()*900}deg)`, opacity: 0 }
        ], {
          duration: 1100 + Math.random() * 900,
          easing: 'cubic-bezier(0.1, 0.7, 0.3, 1)',
          fill: 'forwards'
        });
        setTimeout(() => c.remove(), 2000);
      }
    }
  </script>
</body>
</html>
