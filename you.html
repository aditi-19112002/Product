<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS JS + Result Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 22px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 110px;
            padding: 13px 0;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-html { background: linear-gradient(90deg, #e34c26, #f06529); }
        .btn-css  { background: linear-gradient(90deg, #264de4, #2965f1); }
        .btn-js   { background: linear-gradient(90deg, #f0db4f, #f7df1e); color: #333; }
        .btn-result { 
            background: linear-gradient(90deg, #00b09b, #96c93d); 
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn.active {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.3);
        }

        .display-box {
            background: #1e1e2e;
            border-radius: 18px;
            padding: 25px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
        }

        /* Code Style */
        pre {
            color: #e2e8f0;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.92rem;
            line-height: 1.55;
            white-space: pre-wrap;
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.35s ease;
        }

        pre.show {
            opacity: 1;
            transform: translateY(0);
        }

        .placeholder {
            color: #94a3b8;
            text-align: center;
            padding-top: 110px;
            font-size: 1.15rem;
        }

        /* ===== FINAL RESULT CARD ===== */
        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 35px 30px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: popIn 0.5s ease;
            display: none;
        }

        .result-card.show {
            display: block;
        }

        .result-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .result-card h3 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .result-card p {
            opacity: 0.9;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .result-card .socials {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .result-card .socials span {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: 0.3s;
            cursor: pointer;
        }

        .result-card .socials span:hover {
            background: white;
            color: #764ba2;
            transform: scale(1.1);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>HTML • CSS • JS • Result</h2>

        <div class="buttons">
            <button class="btn btn-html" onclick="showContent('html', this)">HTML</button>
            <button class="btn btn-css" onclick="showContent('css', this)">CSS</button>
            <button class="btn btn-js" onclick="showContent('js', this)">JS</button>
            <button class="btn btn-result" onclick="showContent('result', this)">Result</button>
        </div>

        <div class="display-box">
            <div class="placeholder" id="placeholder">
                Click any button ✨
            </div>

            <pre id="codeDisplay"></pre>

           
            <div class="result-card" id="resultCard">
                <img src="code.jpeg" alt="Profile">
                <h3>Aditi Keshri</h3>
                <p>Frontend Developer | HTML • CSS • JS</p>
                <div class="socials">
                    <span>📘</span>
          
                    <span>📸</span>
                    <span>💼</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const codes = {
            html: `&lt;div class="card"&gt;
  &lt;img src="profile.jpg"&gt;
  &lt;h3&gt;Aditi Keshri&lt;/h3&gt;
  &lt;p&gt;Frontend Developer&lt;/p&gt;
  &lt;div class="socials"&gt;
    &lt;span&gt;Facebook&lt;/span&gt;
    &lt;span&gt;Twitter&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;`,

            css: `.card {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 20px;
  padding: 35px;
  text-align: center;
  color: white;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.card img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 4px solid white;
}`,

            js: `
document.querySelector(".btn-result")
  .addEventListener("click", () => {
    document.getElementById("resultCard")
      .classList.add("show");
});`
        };

        function showContent(type, btn) {
           
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const placeholder = document.getElementById('placeholder');
            const codeDisplay = document.getElementById('codeDisplay');
            const resultCard = document.getElementById('resultCard');

         
            placeholder.style.display = 'none';
            codeDisplay.classList.remove('show');
            resultCard.classList.remove('show');
            codeDisplay.style.display = 'none';

            if (type === 'result') {
               
                setTimeout(() => {
                    resultCard.classList.add('show');
                }, 50);
            } else {
              
                codeDisplay.style.display = 'block';
                setTimeout(() => {
                    codeDisplay.innerHTML = codes[type];
                    codeDisplay.classList.add('show');
                }, 40);
            }
        }
    </script>
</body>
</html>
