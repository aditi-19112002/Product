<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #ffffff;
      color: #222;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00b4d8, #e60073);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
    }
    .score-board span {
      color: #00b4d8;
    }
    canvas {
      background: #f8f9fa;
      border: 3px solid #dee2e6;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 95vw;
      max-height: 70vh;
    }
    .controls {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }
    .btn {
      margin-top: 16px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(90deg, #00b4d8, #e60073);
      border: none;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.97);
      padding: 30px 40px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #ddd;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      display: none;
      z-index: 10;
    }
    .game-over h2 {
      color: #e60073;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>NEON SNAKE</h1>
  <div class="score-board">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="highScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
  
  </div>

  <button class="btn" id="startBtn" onclick="startGame()">Start Game</button>

  <div class="game-over" id="gameOverScreen">
    <h2>Game Over!</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()" style="margin-top: 15px;">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = {};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('neonSnakeHigh') || 0;
    let gameLoop;
    let isRunning = false;

    document.getElementById('highScore').textContent = highScore;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      score = 0;
      document.getElementById('score').textContent = score;
      placeFood();
      document.getElementById('gameOverScreen').style.display = 'none';
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          placeFood();
          return;
        }
      }
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Head
          ctx.fillStyle = '#00b4d8';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00b4d8';
        } else {
          ctx.fillStyle = `hsl(${190 + index * 2}, 85%, 45%)`;
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#00b4d8';
        }
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      });
      ctx.shadowBlur = 0;

      // Draw food
      ctx.fillStyle = '#e60073';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#e60073';
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('neonSnakeHigh', highScore);
          document.getElementById('highScore').textContent = highScore;
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      clearInterval(gameLoop);
      isRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').style.display = 'block';
      document.getElementById('startBtn').style.display = 'none';
    }

    function startGame() {
      if (isRunning) return;
      init();
      isRunning = true;
      document.getElementById('startBtn').style.display = 'none';
      gameLoop = setInterval(() => {
        update();
        draw();
      }, 100);
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (!isRunning) return;
      switch (e.key) {
        case 'ArrowUp':
          if (dy !== 1) { dx = 0; dy = -1; }
          break;
        case 'ArrowDown':
          if (dy !== -1) { dx = 0; dy = 1; }
          break;
        case 'ArrowLeft':
          if (dx !== 1) { dx = -1; dy = 0; }
          break;
        case 'ArrowRight':
          if (dx !== -1) { dx = 1; dy = 0; }
          break;
      }
    });

   
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (!isRunning) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30 && dx !== -1) { dx = 1; dy = 0; }
        else if (diffX < -30 && dx !== 1) { dx = -1; dy = 0; }
      } else {
        if (diffY > 30 && dy !== -1) { dx = 0; dy = 1; }
        else if (diffY < -30 && dy !== 1) { dx = 0; dy = -1; }
      }
    }, { passive: true });

    // Initial draw
    draw();
  </script>
</body>
</html>
