<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0d0d0d;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: #161616;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(90deg, #00d4ff, #7b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .api-key-box {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .api-key-box input {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      width: 240px;
      font-size: 13px;
    }

    .api-key-box button {
      background: #7b61ff;
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 14px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .user .avatar {
      background: #2a2a2a;
    }

    .bot .avatar {
      background: linear-gradient(135deg, #00d4ff, #7b61ff);
    }

    .content {
      background: #1a1a1a;
      padding: 14px 18px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 15.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .content {
      background: #252525;
    }

    .bot .content {
      border: 1px solid #2a2a2a;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 8px 0;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #7b61ff;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Area */
    .input-area {
      background: #161616;
      border-top: 1px solid #2a2a2a;
      padding: 16px 24px 24px;
    }

    .input-wrapper {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 10px 14px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      resize: none;
      max-height: 150px;
      outline: none;
      line-height: 1.5;
      padding: 6px 0;
    }

    #send-btn {
      background: linear-gradient(135deg, #00d4ff, #7b61ff);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }

    #send-btn:hover {
      transform: scale(1.05);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }

    /* Welcome */
    .welcome {
      text-align: center;
      margin: auto;
      padding: 40px 20px;
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d4ff, #7b61ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      color: #888;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>✦ My AI Chatbot</h1>
    <div class="api-key-box">
      <input type="password" id="apiKey" placeholder="Paste Gemini API Key here" />
      <button onclick="saveKey()">Save</button>
    </div>
  </div>

  <div id="chat-container">
    <div class="welcome" id="welcome">
      <h2>Hello! 👋</h2>
      <!-- <p>Apna Gemini API key daalo aur chat shuru karo</p> -->
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="user-input" rows="1" placeholder="Message kya hai..." onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <div class="hint">Gemini Free API se powered • Dark Theme</div>
  </div>

  <script>
    // ================== CONFIG ==================
    let API_KEY = localStorage.getItem("gemini_api_key") || "";

    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const welcome = document.getElementById("welcome");

    // Auto resize textarea
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = userInput.scrollHeight + "px";
    });

    function saveKey() {
      const key = document.getElementById("apiKey").value.trim();
      if (key) {
        API_KEY = key;
        localStorage.setItem("gemini_api_key", key);
        alert("API Key saved successfully!");
      } else {
        alert("Please enter API key");
      }
    }

    // Load saved key
    if (API_KEY) {
      document.getElementById("apiKey").value = API_KEY;
    }

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function addMessage(text, sender) {
      if (welcome) welcome.remove();

      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.innerHTML = `
        <div class="avatar">${sender === "user" ? "👤" : "✦"}</div>
        <div class="content">${text}</div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message bot";
      div.id = "typing";
      div.innerHTML = `
        <div class="avatar">✦</div>
        <div class="content">
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    // Smooth typing animation
    async function typeText(element, text) {
      element.innerHTML = "";
      for (let i = 0; i < text.length; i++) {
        element.innerHTML += text[i];
        chatContainer.scrollTop = chatContainer.scrollHeight;
        await new Promise(r => setTimeout(r, 11));
      }
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!API_KEY) {
        alert("Pehle Gemini API Key daalo aur Save karo!\n\nKey yahan se lo:\nhttps://aistudio.google.com/apikey");
        return;
      }

      
      addMessage(text, "user");
      userInput.value = "";
      userInput.style.height = "auto";
      sendBtn.disabled = true;

      showTyping();

      try {
       
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: text }]
              }]
            })
          }
        );

        const data = await response.json();
        removeTyping();

        if (data.error) {
          addMessage("❌ Error: " + data.error.message, "bot");
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          const reply = data.candidates[0].content.parts[0].text;
          const botMsg = addMessage("", "bot");
          const contentDiv = botMsg.querySelector(".content");
          await typeText(contentDiv, reply);
        } else {
          addMessage("Kuch galat ho gaya. Dobara try karo.", "bot");
        }
      } catch (err) {
        removeTyping();
        addMessage("Network error. Internet check karo ya API key sahi hai?", "bot");
        console.error(err);
      }

      sendBtn.disabled = false;
      userInput.focus();
    }
  </script>
</body>
</html>
